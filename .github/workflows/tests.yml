name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Every skill under skills/ is self-contained: compile its scripts and run its own tests.
      - name: Test each skill
        shell: bash
        run: |
          for d in skills/*/; do
            echo "::group::$d"
            if [ -d "$d/scripts" ]; then python -m compileall -q "$d/scripts"; fi
            if [ -d "$d/tests" ]; then (cd "$d" && python -m unittest discover tests -v); fi
            echo "::endgroup::"
          done
