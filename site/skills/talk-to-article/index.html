h1.title{font-size:36px;line-height:1.1;font-weight:500;letter-spacing:-.03em;color:var(--ink);margin-bottom:8px}
.byline{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute-2);flex-wrap:wrap}

.lead{font-size:16px;color:var(--mute-1);line-height:1.625}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute-2);background:var(--paper-3);padding:4px 12px;border:1px solid var(--line)}
.metrics{display:flex;flex-wrap:wrap;align-items:center;gap:24px;margin-bottom:40px;padding-bottom:32px;border-bottom:1px solid var(--line)}
.metric{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute-2)}
.metric b{font-weight:500;color:var(--ink)}
.mb8{margin-bottom:32px}.mb10{margin-bottom:40px}
h2.sec{font-size:18px;line-height:1.55;font-weight:600;color:var(--ink);margin-bottom:16px;scroll-margin-top:24px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-head h2.sec{margin:0}
.sec-head a{font-size:12px;color:var(--mute-2);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em}
.sec-head a:hover{color:var(--ink)}

/* Tabs + code */
.tabs{display:inline-flex;margin-bottom:16px;border-left:1px solid var(--line);border-top:1px solid var(--line);flex-wrap:wrap}
.tabs button{padding:8px 16px;font-size:12px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;border-right:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mute-2);transition:all .15s}

.tabs button[aria-selected=true],.tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
.langbar .tabs{margin:0}

.ticks .x{color:var(--mute-2);flex-shrink:0}

.ticks b{color:var(--ink);font-weight:600}
.fine{margin-top:16px;font-size:12px;color:var(--mute-2)}

.prose strong{color:var(--ink);font-weight:600}
.prose a{color:var(--ink);font-weight:500;text-decoration:underline;text-underline-offset:4px}

.prose hr{border-top:1px solid var(--line);margin:32px 0}
.prose .tbl{overflow-x:auto;margin-bottom:16px;border:1px solid var(--line)}

.prose th{background:var(--paper-2);color:var(--ink);font-weight:600}

.synced a:hover{color:var(--ink)}

.faq summary svg{transition:transform .2s var(--ease);color:var(--mute-2)}

.faq code{font-family:var(--font-mono);font-size:12px;color:var(--ink)}

.side{display:flex;flex-direction:column;gap:16px}

.rows{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}

.row .v{font-weight:500;color:var(--ink);font-size:12px}

.row.top{padding-top:12px;border-top:1px solid var(--line)}
.author{display:flex;align-items:center;gap:12px}
.author .av{width:40px;height:40px;border:1px solid var(--line);background:var(--paper-3);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--mute-1);overflow:hidden}
.author .av img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
.author p:first-child{font-size:14px;font-weight:500;color:var(--ink)}
.author p+p{font-size:12px;color:var(--mute-2);font-family:var(--font-mono)}
.author:hover p:first-child{text-decoration:underline;text-underline-offset:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute-2);background:var(--paper-3);padding:4px 8px;border:1px solid var(--line)}
.report{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute-2);transition:color .15s}
.report:hover{color:var(--ink)}
.report svg.i{width:12px;height:12px}

/* Footer */
footer{border-top:1px solid var(--line);background:#fff;margin-top:auto}
footer .as-wrap{padding-top:48px;padding-bottom:48px}
.logo{display:inline-flex;align-items:center}

.logo .word{font-size:18px;font-weight:600;letter-spacing:-.03em;color:var(--ink)}
footer p{font-size:12px;color:var(--mute-1);margin-top:12px;line-height:1.625;max-width:320px}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;padding:8px 14px;z-index:100}

@media (min-width:640px){.note{flex-direction:row;align-items:center}}
@media (min-width:768px){
  h1.title{font-size:60px;line-height:1}
  .hgrid.c2,.shots,.steps{grid-template-columns:1fr 1fr}
}
@media (min-width:1024px){
  .layout{grid-template-columns:1fr 340px}
  .side{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow-y:auto;overscroll-behavior:contain;align-self:start}
  .card{padding:32px}
  .steps{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:639px){.as-wrap{padding:0 16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    Object.assign(repo, { stars: v.stargazers_count, forks: v.forks_count, license: v.license?.spdx_id || repo.license,
      language: v.language || repo.language, branch: v.default_branch, pushed: v.pushed_at, topics: v.topics || [] });
  }
  if (contrib.status === "fulfilled" && Array.isArray(contrib.value)) repo.contributors = contrib.value.map(c => ({ login: c.login, avatar: c.avatar_url }));
  if (commits.status === "fulfilled" && commits.value[0]) { const c = commits.value[0]; repo.sha = c.sha.slice(0, 7); repo.commitMsg = c.commit.message.split("\n")[0]; repo.pushed = c.commit.committer.date; }
}

// SKILL.md -> sanitized HTML. Relative repo links go to GitHub, since this site has a single page.
function renderSkill(el) {
  el.innerHTML = DOMPurify.sanitize(marked.parse(skillMd.replace(/^---\n[\s\S]*?\n---\n/, ""), { gfm: true }));
  el.querySelectorAll("table").forEach(tb => { const w = document.createElement("div"); w.className = "tbl"; tb.replaceWith(w); w.appendChild(tb); });
  el.querySelectorAll("h1,h2,h3").forEach(h => { h.id = "skill-" + slug(h.textContent); });
  el.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href");
    if (href.startsWith("#")) { a.setAttribute("href", "#skill-" + slug(decodeURIComponent(href.slice(1)))); return; }
    if (!/^[a-z]+:/i.test(href)) { const p = new URL(href, `https://x/${DIR}/`).pathname.slice(1); a.href = /\.[a-z]+$/i.test(p) ? blobUrl(p) : `${REPO_URL}/tree/${repo.branch}/${p}`; }
    a.target = "_blank"; a.rel = "noopener";
  });
}

function codeBlock(text) {
  const html = esc(text).replace(/^(#.*)$/gm, '<span class="muted">$1</span>');
  return `<div class="code"><pre><code>${html}</code></pre><button class="copy" data-copy="${esc(text.replace(/^#.*\n?/gm, "").trim())}" aria-label="${t.copyAria}">${ic("copy")}</button></div>`;
}
const INSTALL = {
  cli: `npx skills add ${OWNER}/${REPO}@talk-to-article`,
  manual: `git clone --depth 1 ${REPO_URL} /tmp/polaarts-skills\ncp -R /tmp/polaarts-skills/${DIR} ~/.claude/skills/`,
  deps: `python3 ~/.claude/skills/talk-to-article/scripts/setup.py\npython3 ~/.claude/skills/talk-to-article/scripts/setup.py --install`,
};
let tab = "cli";
const installCode = () => codeBlock(`${t.cmt[tab]}\n${INSTALL[tab]}`);

function treeBlock() {
  const files = ["index.html", "images/", "clips/", "article.md", "transcript.md", "manifest.json"];
  const lines = files.map((f, i) => `${i === files.length - 1 ? "└──" : "├──"} ${f.padEnd(14)}# ${t.tree[i]}`);
  return `<div class="code"><pre><code>~/talk-articles/design-will-never-be-the-same-na1OyJ3E7Kc/\n${esc(lines.join("\n"))}</code></pre></div>`;
}

function render() {
  t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  document.querySelector('meta[name="description"]').content = t.desc;
  const a = repo.contributors[0] || { login: OWNER };
  const n = repo.contributors.length;
  const tags = (repo.topics.length ? repo.topics : ["agent-skill", "claude-code", "video", "transcripts", "yt-dlp", "ffmpeg", "html"]);
  const fetched = new Date().toLocaleDateString(loc(), { month: "short", day: "numeric", year: "numeric" });

  document.getElementById("app").innerHTML = `<div class="page"><div class="as-wrap">
    <div class="langbar"><a class="back" href="../../">← Polaarts Skills</a><div class="tabs" role="group" aria-label="${t.langLabel}">
      ${Object.entries(LANGS).map(([k, v]) => `<button data-lang="${k}" lang="${k}" aria-pressed="${k === lang}">${v}</button>`).join("")}
    </div></div>
    <div class="layout"><div>
      <div class="mb8">
        <h1 class="title">talk-to-article</h1>
        <div class="byline"><span>${t.by}</span><a href="https://github.com/${OWNER}" target="_blank" rel="noopener">${OWNER}</a><span>·</span><b>${t.category}</b></div>
      </div>
      <div class="mb8"><p class="lead">${t.lead}</p></div>
      <div class="chips mb8">${t.chips.map(c => `<span class="chip">${c}</span>`).join("")}</div>
      <div class="metrics">
        <div class="metric">${ic("star")}<b>${fmtNum(repo.stars)}</b>${t.stars}</div>
        <div class="metric">${ic("cal")}<b>${t.updated}</b>${ago(repo.pushed)}</div>
        <div class="metric">${ic("users")}<b>${n}</b>${t.contributor(n)}</div>
        <div class="metric">${ic("commit")}<b class="mono" style="font-size:12px">${esc(repo.sha)}</b><span style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(repo.commitMsg)}</span></div>
      </div>

      <section class="mb10" aria-labelledby="install-h">
        <h2 class="sec" id="install-h">${t.install}</h2>
        <div class="tabs" role="tablist">${Object.keys(INSTALL).map(k => `<button role="tab" aria-selected="${k === tab}" data-tab="${k}">${t.tabs[k]}</button>`).join("")}</div>
        <div id="tab-panel" role="tabpanel">${installCode()}</div>
        <div class="note"><p style="flex:1;min-width:0">${t.ask} <a href="${blobUrl(DIR + "/README.md")}" target="_blank" rel="noopener">${t.readme}</a></p>
          <a class="btn-ink" href="#skill-h">${t.viewSkill}</a></div>
      </section>

      <section class="mb10 hgrid c2">
        <div><h2>${t.whenT}</h2><ul class="ticks">${t.when.map(x => `<li><span class="g">→</span><span>${x}</span></li>`).join("")}</ul></div>
        <div class="alt"><h2>${t.notT}</h2><ul class="ticks">${t.not.map(x => `<li><span class="x">✕</span><span>${x}</span></li>`).join("")}</ul></div>
      </section>

      <section class="mb10" aria-labelledby="what-h">
        <div class="sec-head"><h2 class="sec" id="what-h">${t.whatT}</h2><a href="${blobUrl(DIR + "/README.md")}" target="_blank" rel="noopener">README ↗</a></div>
        <div class="shots">
          ${["light", "dark"].map(k => `<figure><img src="${rawUrl(`${DIR}/docs/screenshot-${k}.png`)}" onerror="this.onerror=null;this.src='../../../${DIR}/docs/screenshot-${k}.png'" alt="${t.shotAlt(t[k])}" loading="lazy">
            <figcaption><span class="as-micro">${t[k]}</span><span class="as-micro" style="color:var(--mute-3)">docs/screenshot-${k}.png</span></figcaption></figure>`).join("")}
        </div>
        <div class="card" style="border-top:0">
          <p class="lead" style="font-size:14px;margin-bottom:12px">${t.folder}</p>
          ${treeBlock()}
        </div>
        <div class="hgrid c2" style="border-top:0">
          <div><h3 class="h">${t.includesT}</h3><ul class="ticks">${t.includes.map(x => `<li><span class="g">→</span><span>${x}</span></li>`).join("")}</ul></div>
          <div class="alt"><h3 class="h">${t.modesT}</h3><ul class="ticks"><li><span class="g">→</span><span>${t.modes}</span></li><li><span class="g">→</span><span>${t.share}</span></li></ul></div>
        </div>
      </section>

      <section class="mb10" aria-labelledby="how-h">
        <div class="sec-head"><h2 class="sec" id="how-h">${t.howT}</h2><a href="${REPO_URL}/tree/${repo.branch}/${DIR}/scripts" target="_blank" rel="noopener">scripts/ ↗</a></div>
        <p class="lead" style="font-size:14px;margin-bottom:16px">${t.how}</p>
        <div class="hgrid steps">${t.steps.map(([name, d], i) => `<a href="${blobUrl(DIR + "/scripts/" + STEP_FILES[i])}" target="_blank" rel="noopener"><span class="n">${t.step} ${String(i + 1).padStart(2, "0")}</span><h3>${name}</h3><code>${STEP_FILES[i]}</code><p>${esc(d)}</p></a>`).join("")}</div>
      </section>

      <section class="mb10" aria-labelledby="skill-h">
        <div class="sec-head"><h2 class="sec" id="skill-h">SKILL.md</h2><a href="${blobUrl(DIR + "/SKILL.md")}" target="_blank" rel="noopener">${t.onGh} ↗</a></div>
        ${lang === "en" ? "" : `<p class="src-note">${t.skillNote}</p>`}
        <div class="card"><div class="prose" id="skill-md" lang="en">${skillErr
          ? `<p>${t.loadErr} <a href="${blobUrl(DIR + "/SKILL.md")}" target="_blank" rel="noopener">${t.openGh}</a>.</p>`
          : `<div class="skeleton" style="width:40%"></div><div class="skeleton"></div><div class="skeleton" style="width:80%"></div>`}</div>
          <div class="synced"><span>${t.synced} <a href="${blobUrl(DIR + "/SKILL.md")}" target="_blank" rel="noopener">${OWNER}/${REPO}@${esc(repo.sha)}</a></span><span>${t.fetched} ${fetched}</span></div></div>
      </section>

      <section class="mb10" aria-labelledby="req-h">
        <h2 class="sec" id="req-h">${t.reqT}</h2>
        <div class="hgrid c2">
          <div><h3 class="h">${t.req}</h3><ul class="ticks">${t.reqs.map(x => `<li><span class="g">→</span><span>${x}</span></li>`).join("")}</ul></div>
          <div class="alt"><h3 class="h">${t.legal}</h3><ul class="ticks">${t.legals.map(x => `<li><span class="g">→</span><span>${x}</span></li>`).join("")}</ul><p class="fine">${t.notLegal}</p></div>
        </div>

      <section class="mb10" aria-labelledby="faq-h">
        <h2 class="sec" id="faq-h">${t.faqT}</h2>

    <div class="side">

        <div class="rows">
          <div class="row"><span>${ic("star", 14)}${t.starsL}</span><span class="v m">${repo.stars.toLocaleString(loc())}</span></div>
          <div class="row"><span>${ic("fork", 14)}${t.forks}</span><span class="v m">${repo.forks.toLocaleString(loc())}</span></div>
          <div class="row"><span>${ic("commit", 14)}${t.commit}</span><span class="v m">${isoDay(repo.pushed)}</span></div>
          <div class="row"><span>${ic("users", 14)}${t.contributors}</span><span class="v m">${n}</span></div>
          <div class="row"><span>${ic("scale", 14)}${t.license}</span><span class="v">${esc(repo.license)}</span></div>
          <div class="row"><span>${ic("code", 14)}${t.language}</span><span class="v">${esc(repo.language)}</span></div>
          <div class="row top"><span>${ic("gh", 14)}${t.source}</span><a class="v m" href="${REPO_URL}/tree/${repo.branch}/${DIR}" target="_blank" rel="noopener">${OWNER}/${REPO}${ic("out", 12)}</a></div>
        </div>
      </div>
      <div class="box"><h3 class="as-micro" style="margin-bottom:12px">${t.author}</h3>
        <a class="author" href="https://github.com/${esc(a.login)}" target="_blank" rel="noopener">
          <div class="av">${a.avatar ? `<img src="${esc(a.avatar)}&s=80" alt="">` : esc(a.login[0].toUpperCase())}</div>
          <div><p>${esc(a.login)}</p><p>@${esc(a.login)}</p></div></a></div>
      <div class="box"><h3 class="as-micro" style="margin-bottom:12px">${t.tagsT}</h3><div class="tags">${tags.map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div></div>
      <a class="report" href="${REPO_URL}/issues/new" target="_blank" rel="noopener">${ic("alert")}${t.report}</a>
    </div></div>
  </div></div>`;

  if (skillMd) renderSkill(document.getElementById("skill-md"));
  document.getElementById("footer").innerHTML = `<div class="as-wrap"><span class="logo"><span class="mark">t→a</span><span class="word">talk-to-article</span></span><p>${t.footer}</p></div>`;
}

// ---------- Interactions ----------
let toastT;
function toast(msg) {
  let el = document.querySelector(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (el.hidden = true), 1600);
}
document.addEventListener("click", async e => {
  const lb = e.target.closest("[data-lang]");
  if (lb) {
    lang = lb.dataset.lang;
    try { localStorage.setItem("ps-lang", lang); } catch {}
    render(); document.querySelector(`[data-lang="${lang}"]`).focus();
    return;
  }
  const tb = e.target.closest("[data-tab]");
  if (tb) {
    tab = tb.dataset.tab;
    tb.parentElement.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b === tb));
    document.getElementById("tab-panel").innerHTML = installCode();
    return;
  }
  const cp = e.target.closest("[data-copy]");
  if (cp) {
    try { await navigator.clipboard.writeText(cp.dataset.copy); cp.innerHTML = ic("check"); toast(t.copied); setTimeout(() => (cp.innerHTML = ic("copy")), 1500); }
    catch { toast(t.copyFail); }
    return;
  }
  // In-page anchors scroll without touching the URL, so the site stays on "/".
  const anchor = e.target.closest('a[href^="#"]');
  if (anchor) { e.preventDefault(); document.getElementById(anchor.getAttribute("href").slice(1))?.scrollIntoView({ behavior: "smooth" }); }
});

// ---------- Boot ----------
if (location.hash) history.replaceState(null, "", location.pathname + location.search);
render(); // first paint with the snapshot
loadRepo().finally(render);
raw(DIR + "/SKILL.md").then(md => { skillMd = md; renderSkill(document.getElementById("skill-md")); })
  .catch(() => { skillErr = true; render(); });
</script>
